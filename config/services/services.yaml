services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsApiPlugin\:
        resource: '../../src/*'
        exclude:
            - '../../src/DependencyInjection/*'
            - '../../src/Application/Operation/OperationFormHelper.php'
            - '../../src/Application/Query/AnalyticsQuery.php'
            - '../../src/Application/Query/SeoStatisticsQuery.php'

    Softspring\CmsApiPlugin\Controller\:
        resource: '../../src/Controller/*'
        tags: [ 'controller.service_arguments' ]

    Softspring\CmsApiPlugin\Schema\ModuleCollectionSchemaExtractor:
        tags: [{ name: 'softspring.form_schema.field_extractor', priority: 200 }]
