services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsApiPlugin\:
        resource: '../../src/*'
        exclude: '../../src/DependencyInjection/*'

    Softspring\CmsApiPlugin\Controller\:
        resource: '../../src/Controller/*'
        tags: [ 'controller.service_arguments' ]
